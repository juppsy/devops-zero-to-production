trigger:
  - main

variables:
  APP_NAME: devops-zero-to-production
  ENVIRONMENT: development
  IMAGE_NAME: demo-app
  CONTAINER_NAME: demo-container
  CONTAINER_PORT: 8080

stages:

  # ==========================================
  # VALIDATE
  # ==========================================

  - stage: Validate
    displayName: "Validate"

    jobs: 
      - job: Validate
        displayName: "Validate Project"

        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - checkout: self
            displayName: "Checkout repository"

          - script: ./scripts/validate-project.sh
            displayName: "Validate project"

          - script: |
              echo "===== BUILD ENVIRONMENT ====="

              echo ""
              echo "Application: $(APP_NAME)"

              echo "Environment: $(ENVIRONMENT)"

              echo ""
              echo "Current directory:"
              pwd

              echo ""
              echo "Current user:"
              whoami

              echo ""
              echo "Git version:"
              git --version

              echo ""
              echo "Python version:"
              python3 --version

              echo ""
              echo "Docker version:"
              docker --version

              echo ""
              echo "Repository files:"
              ls -la
            displayName: "Inspect build environment"


  # ==========================================
  # QUALITY
  # ==========================================

  - stage: Quality
    displayName: "Quality"
    dependsOn: Validate

    jobs:
      - job: Quality
        displayName: "Quality Checks"

        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - checkout: self
            displayName: "Checkout repository"

          - script: |
              python3 -m pip install --upgrade pip
              pip3 install -r app/requirements.txt
            displayName: "Install Python dependencies"

          - script: |
              python -m ruff check .
            displayName: "Run Ruff"

          - script: |
              python -m pytest
            displayName: "Run tests"


  # ==========================================
  # SECURITY
  # ==========================================

  - stage: Security
    displayName: "Security"
    dependsOn: Quality

    jobs:
      - job: Security
        displayName: "Security Checks"

        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - checkout: self
            displayName: "Checkout repository"

          - script: |
              python3 -m pip install --upgrade pip
              pip3 install -r app/requirements.txt
            displayName: "Install Python dependencies"

          - task: SonarCloudPrepare@4
            inputs:
              SonarQube: 'sonarqube connection'
              organization: 'juppsy'
              scannerMode: 'cli'
              cliScannerVersion: '8.1.0.6389'
              configMode: 'file'
            displayName: "Prepare SonarCloud Analysis"

          - task: SonarCloudAnalyze@4
            inputs:
              jdkversion: 'JAVA_HOME_17_X64'
            displayName: "Run SonarCloud Analysis"

          - task: SonarCloudPublish@4
            inputs:
              pollingTimeoutSec: "300"
            displayName: "Check Quality Gate"

          - task: SnykSecurityScan@1
            inputs:
              serviceConnectionEndpoint: 'snyk connection'
              testType: 'app'
              targetFile: 'app/requirements.txt'
              monitorWhen: 'always'
              failOnIssues: true


  # ==========================================
  # BUILD
  # ==========================================

  - stage: Build
    displayName: "Build"
    dependsOn: Security

    jobs:
      - job: Build
        displayName: "Build Docker Image"

        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - checkout: self
            displayName: "Checkout repository"

          - script: |
              echo "===== BUILD DOCKER IMAGE ====="

              docker build \
                -f docker/Dockerfile \
                -t $(IMAGE_NAME):$(Build.BuildId) .
            displayName: "Build Docker image"

          - script: |
              echo "===== SMOKE TEST DOCKER IMAGE ====="

              docker run -d \
                --name $(CONTAINER_NAME) \
                -p $(CONTAINER_PORT):$(CONTAINER_PORT) \
                $(IMAGE_NAME):$(Build.BuildId)

              sleep 5

              curl -f http://localhost:$(CONTAINER_PORT)

              docker stop $(CONTAINER_NAME)
              docker rm $(CONTAINER_NAME)
            displayName: "Smoke test Docker image"